<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Secret Catalog — Yazhí Studio</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#11100f;
  --surface:#191816;
  --ink:#f2ede3;
  --red:#b3372c;
  --line:#44403a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Inter Tight",sans-serif;
}

.hidden{
  display:none !important;
}

.gate,
.loading{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  text-align:center;
  padding:20px;
  background:var(--bg);
}

.title{
  font-family:"Inter Tight",sans-serif;
  font-size:3.2rem;
  font-weight:800;
  letter-spacing:.08em;
}

.label{
  letter-spacing:.25em;
  font-size:.75rem;
  opacity:.75;
}

.archive-line{
  width:120px;
  height:1px;
  background:#777;
  margin:18px 0;
}

.archive-info{
  font-family:"Inter Tight",sans-serif;
  font-size:.95rem;
  letter-spacing:.12em;
  line-height:2;
}

.archive-info span{
  color:var(--red);
}

.gate-text{
  font-family:"Cormorant Garamond",serif;
  font-size:1.3rem;
  max-width:450px;
  font-style:italic;
  opacity:.9;
}

input{
  background:rgba(255,255,255,.05);
  border:1px solid #666;
  color:white;
  padding:16px;
  width:260px;
  text-align:center;
  font-family:"Inter Tight",sans-serif;
  letter-spacing:.12em;
}

input:focus{
  outline:none;
  border-color:white;
}

button{
  padding:14px 42px;
  background:var(--red);
  border:none;
  color:#f5f3ee;
  font-family:"Inter Tight",sans-serif;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
  cursor:pointer;
}

button:hover{
  background:#8f2b23;
}

.error{
  color:var(--red);
  height:1rem;
  font-size:.8rem;
  letter-spacing:.08em;
}

.bar{
  width:220px;
  height:8px;
  border:1px solid #777;
}

.fill{
  height:100%;
  width:0;
  background:var(--ink);
  transition:width .8s ease;
}

#catalog{
  position:relative;
  background-image:radial-gradient(circle,#fff 1px,transparent 1px);
  background-size:8px 8px;
  background-color:var(--bg);
  min-height:100vh;
}

.page-list{
  max-width:900px;
  margin:0 auto;
  padding:60px 20px;
}

.page-item{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .7s ease, transform .7s ease;
}

.page-item.visible{
  opacity:1;
  transform:translateY(0);
}

.page-item + .page-item{
  margin-top:48px;
}

img{
  display:block;
  width:100%;
  height:auto;
}

footer{
  text-align:center;
  padding:60px 20px;
  color:#999;
  font-size:.75rem;
  letter-spacing:.15em;
  line-height:2;
  position:relative;
}
</style>
</head>

<body>

<!-- PRIVATE ARCHIVE ACCESS -->
<div id="gate" class="gate">

  <div class="title">YAZHÍ STUDIO</div>
  <div class="label">PRIVATE ARCHIVE / 2026</div>
  <div class="archive-line"></div>

  <div class="archive-info">
    <span>DOCUMENT</span> SECRET CATALOG<br><br>
    <span>STATUS</span> RESTRICTED COLLECTION<br><br>
    <span>LOCATION</span> SOUTHERN CHILE<br><br>
    <span>ACCESS</span> INVITED MEMBERS ONLY
  </div>

  <p class="gate-text">Some pieces exist before they become visible.</p>

  <input id="pw" type="password" placeholder="ARCHIVE KEY" autocomplete="off">
  <button onclick="unlock()">OPEN ARCHIVE</button>

  <div id="err" class="error"></div>

</div>

<!-- LOADING -->
<div id="loading" class="loading hidden">
  <div class="title">ACCESS GRANTED</div>
  <div class="label">OPENING PRIVATE ARCHIVE</div>
  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>
</div>

<!-- CATALOG -->
<div id="catalog" class="hidden">

  <div class="page-list">
    <div class="page-item"><img loading="lazy" src="1.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="2.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="3.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="4.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="5.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="6.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="7.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="8.png" alt=""></div>
    <div class="page-item"><img loading="lazy" src="9.png" alt=""></div>
  </div>

  <footer>
    ARCHIVE VERSION 2026.07<br>
    YAZHÍ STUDIO<br>
    SOUTHERN CHILE<br><br>
    END OF FILE
  </footer>

</div>

<script>
const ARCHIVE_KEY = "YSC26";

function unlock(){
  const v = document.getElementById("pw").value.trim().toUpperCase();

  if(v !== ARCHIVE_KEY){
    document.getElementById("err").textContent = "Archive key not recognized.";
    return;
  }

  document.getElementById("err").textContent = "";
  sessionStorage.setItem("ysc", "1");
  start();
}

function start(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("loading").classList.remove("hidden");

  setTimeout(() => {
    document.getElementById("fill").style.width = "100%";
  }, 50);

  setTimeout(() => {
    document.getElementById("loading").classList.add("hidden");

    // Always scroll to top before revealing the catalog
    window.scrollTo(0, 0);

    document.getElementById("catalog").classList.remove("hidden");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: .15 });

    document.querySelectorAll(".page-item").forEach(item => observer.observe(item));

  }, 1000);
}

if(sessionStorage.getItem("ysc")){
  document.getElementById("gate").classList.add("hidden");
  start();
}else{
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("catalog").classList.add("hidden");
  document.getElementById("pw").focus();
}

document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    unlock();
  }
});
</script>

</body>
</html>
