<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Secret Catalog — Yazhí Studio</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#11100f;
  --ink:#f2ede3;
  --red:#b3372c;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:"Inter Tight",sans-serif;
}

.wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  text-align:center;
  padding:20px;
}

.title{
  font-size:3.2rem;
  font-weight:800;
  letter-spacing:.08em;
}

.label{
  letter-spacing:.25em;
  font-size:.75rem;
  opacity:.75;
  color:var(--red);
}

.line{
  width:120px;
  height:1px;
  background:#777;
  margin:18px 0;
}

.text{
  font-family:"Cormorant Garamond",serif;
  font-size:1.3rem;
  font-style:italic;
  max-width:450px;
  opacity:.9;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="title">YAZHÍ STUDIO</div>
  <div class="label">PRIVATE ARCHIVE / 2026</div>
  <div class="line"></div>
  <p class="text">This archive is currently closed.<br></p>
</div>

</body>
</html>
