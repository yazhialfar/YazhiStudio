<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Secret Catalog — Yazhí Studio</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --cream: #f2ede3;
    --ink: #1c1a17;
    --red: #b3372c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    font-family: 'Courier New', Courier, monospace;
  }

  .page-list {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .page-item {
    width: 100%;
    display: block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .page-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .page-item img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Delgada línea divisoria entre páginas para que se sientan como hojas distintas */
  .page-item + .page-item {
    border-top: 1px solid rgba(242, 237, 227, 0.08);
  }

  footer {
    text-align: center;
    color: rgba(242, 237, 227, 0.4);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 40px 20px 60px;
  }

  footer a {
    color: var(--cream);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }

  @media (prefers-reduced-motion: reduce) {
    .page-item {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>
</head>
<body>

  <div class="page-list">
    <div class="page-item"><img src="01-cover.png" alt="The Secret Catalog — portada"></div>
    <div class="page-item"><img src="02-welcome.png" alt="Bienvenida y envíos"></div>
    <div class="page-item"><img src="03-caos-gula.png" alt="Colección Caos y Gula"></div>
    <div class="page-item"><img src="04-detalle.png" alt="Detalle de piezas"></div>
    <div class="page-item"><img src="05-grid.png" alt="Grid de piezas disponibles"></div>
  </div>

  <footer>
    Yazhí Studio · Temuco, Chile — <a href="mailto:hello@yazhistudio.com">contacto</a>
  </footer>

<script>
  const items = document.querySelectorAll('.page-item');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  items.forEach(item => observer.observe(item));
</script>

</body>
</html>
